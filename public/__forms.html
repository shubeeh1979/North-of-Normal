<!-- Registers the site's forms with Netlify Forms at build time. Not linked from the site. -->
<!DOCTYPE html>
<html>
  <body>
    <form name="licensing-inquiry" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="licensing-inquiry" />
      <input type="hidden" name="subject" />
      <input name="name" />
      <input name="email" />
      <input name="phone" />
      <textarea name="message"></textarea>
      <input name="bot-field" />
    </form>
  </body>
</html>
