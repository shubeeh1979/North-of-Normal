[build]
  command = "npm install && npm run build"
  publish = "dist"

# Old Base44 episode links go to the podcast page
[[redirects]]
  from = "/podcast-episode"
  to = "/podcast"
  status = 301

[[redirects]]
  from = "/podcastepisode"
  to = "/podcast"
  status = 301

[[redirects]]
  from = "/home"
  to = "/"
  status = 301

[[redirects]]
  from = "/artistprofile"
  to = "/artist-profile"
  status = 301

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
